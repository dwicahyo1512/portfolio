<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Kontak &amp; Saran - Muhamad Dwi Cahyo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', system-ui, sans-serif;
            background: #f0f4f8;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1e40af;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 40px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #334155;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            border-color: #3b82f6;
            outline: none;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .full {
            grid-column: 1 / -1;
        }

        input[type="submit"] {
            grid-column: 1 / -1;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        input[type="submit"]:hover {
            background: #2563eb;
        }

        .hint {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 4px;
        }

        footer {
            text-align: center;
            margin-top: 24px;
        }

        footer a {
            color: #1e40af;
        }

        @media (max-width: 768px) {
            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Formulir Kontak &amp; Saran</h1>
        <p class="subtitle">Hubungi saya melalui formulir di bawah ini</p>

        <form method="POST">
            <div>
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" name="name" placeholder="Muhamad Dwi Cahyo" required minlength="4" maxlength="60">
                <p class="hint">Minimal 4 karakter</p>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                <p class="hint">Contoh: nama@email.com</p>
            </div>

            <div>
                <label for="phone">Nomor Telepon</label>
                <input type="tel" id="phone" name="phone" placeholder="081234567890" pattern="\+?62?[0-9]{9,15}" required>
                <p class="hint">Format: 08xxxxxxxxxx atau +62xxxxxxxxxx</p>
            </div>

            <div>
                <label for="age">Usia</label>
                <input type="number" id="age" name="age" placeholder="20" min="16" max="100" required>
                <p class="hint">Antara 16 sampai 100 tahun</p>
            </div>

            <div>
                <label for="date">Tanggal Kunjungan</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div>
                <label for="topic">Topik</label>
                <select id="topic" name="topic" required>
                    <option value="">-- Pilih topik --</option>
                    <option value="saran">Saran</option>
                    <option value="pertanyaan">Pertanyaan</option>
                    <option value="kolaborasi">Kolaborasi</option>
                </select>
            </div>

            <div class="full">
                <label for="message">Pesan / Saran</label>
                <textarea id="message" name="message" rows="6" placeholder="Tulis saran atau pertanyaan Anda..." required minlength="10"></textarea>
                <p class="hint">Minimal 10 karakter</p>
            </div>

            <input type="submit" value="Kirim Pesan">
        </form>
    </div>

    <footer>
        <p><a href="pratikum2.html">&larr; Kembali ke halaman profil</a></p>
    </footer>

</body>
</html>
