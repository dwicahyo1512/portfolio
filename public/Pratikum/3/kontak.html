<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Kontak &amp; Saran - Muhamad Dwi Cahyo (Praktikum 3)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg-page: #f8fafc;
            --bg-surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--bg-surface);
            border-radius: var(--radius);
            padding: 35px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #ffffff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 4px;
        }

        .radio-label, .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
            font-size: 0.92rem;
        }

        .radio-label input, .checkbox-label input {
            width: auto;
            cursor: pointer;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
            align-self: flex-start;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="pratikum3.html" class="back-link">&larr; Kembali ke Halaman Praktikum 3</a>
        
        <h1>Hubungi Kami &amp; Kirim Saran</h1>
        <p class="subtitle">Silakan isi formulir di bawah untuk menyampaikan pesan, kritik, atau saran.</p>

        <form action="#" method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nama">Nama Lengkap *</label>
                    <input type="text" id="nama" name="nama" placeholder="Contoh: Budi Santoso" required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email *</label>
                    <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                </div>

                <div class="form-group">
                    <label for="telepon">Nomor Telepon / WhatsApp</label>
                    <input type="tel" id="telepon" name="telepon" placeholder="08xxxxxxxxxx" pattern="(\+62|62|0)8[1-9][0-9]{6,10}" title="Nomor telepon Indonesia (contoh: 081234567890)">
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori Pesan *</label>
                    <select id="kategori" name="kategori" required>
                        <option value="">-- Pilih Kategori --</option>
                        <option value="pertanyaan">Pertanyaan Seputar Materi</option>
                        <option value="saran">Saran &amp; Masukan</option>
                        <option value="kolaborasi">Ajakan Kolaborasi Proyek</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Peran / Status Anda:</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="peran" value="mahasiswa" checked> Mahasiswa
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="peran" value="dosen"> Dosen / Pengajar
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="peran" value="umum"> Umum / Profesional
                        </label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="pesan">Isi Pesan / Saran *</label>
                    <textarea id="pesan" name="pesan" placeholder="Tuliskan pesan Anda secara jelas di sini..." required></textarea>
                </div>

                <div class="form-group full-width">
                    <label class="checkbox-label">
                        <input type="checkbox" name="setuju" required> Saya menyatakan bahwa informasi yang saya kirimkan adalah benar.
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit">Kirim Pesan</button>
        </form>
    </div>
</body>
</html>
